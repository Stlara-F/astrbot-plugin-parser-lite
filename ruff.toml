line-length = 88
target-version = "py310"

[format]
line-ending = "lf"

[lint]
ignore = [
  "E501", "E701", "E702", "ASYNC240", "RUF100", "E902", "T201",
  "E402", # module-import-not-at-top-of-file
  "UP037", # quoted-annotation
  "RUF001", # ambiguous-unicode-character-string
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
  "TID252", # relative-imports
]
select = [
  "F", # Pyflakes
  "W", # pycodestyle warnings
  "E", # pycodestyle errors
  "I", # isort
  "UP", # pyupgrade
  "ASYNC", # flake8-async
  "C4", # flake8-comprehensions
  "T10", # flake8-debugger
  "T20", # flake8-print
  "PYI", # flake8-pyi
  "PT", # flake8-pytest-style
  "Q", # flake8-quotes
  "TID", # flake8-tidy-imports
  "RUF", # Ruff-specific rules
]

[lint.isort]
extra-standard-library = ["typing_extensions"]
force-sort-within-sections = true

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.per-file-ignores]
"scripts/generate_standalone.py" = ["T201", "E501", "E701", "E702"]
"scripts/install_deps.py" = ["E401"]
"scripts/verify_import.py" = ["T201", "E701", "E702"]

# Auto-generated by standalone workflow
[lint.per-file-ignores]
"src/nonebot_plugin_parser_lite/utils/_standalone_fake.py" = ["ALL"]
"src/nonebot_plugin_parser_lite/utils/env.py" = ["I001"]
"src/nonebot_plugin_parser_lite/utils/_flags.py" = ["I001"]
"src/nonebot_plugin_parser_lite/__init__.py" = ["I001"]
