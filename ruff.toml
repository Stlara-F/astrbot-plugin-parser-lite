line-length = 88
target-version = "py310"

[format]
line-ending = "lf"

[lint]
ignore = [
  "E402", # module-import-not-at-top-of-file
  "UP037", # quoted-annotation
  "RUF001", # ambiguous-unicode-character-string
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
  "TID252", # relative-imports
  "E501", # line-too-long (bridge main.py + upstream style)
  "RUF100", # unused-noqa (E501 removed from enabled rules, makes upstream noqa stale)
  "T201", # print-found (test files + upstream utility scripts)
  "E701", # multiple-statements-on-one-line (upstream style)
  "E702", # multiple-statements-on-one-line-semicolon
  "ASYNC240", # async-timeout-without-await (upstream)
  "E902", # io-error
]
select = [
  "F", # Pyflakes
  "W", # pycodestyle warnings
  "E", # pycodestyle errors
  "I", # isort
  "UP", # pyupgrade
  "ASYNC", # flake8-async
  "C4", # flake8-comprehensions
  "T10", # flake8-debugger
  "T20", # flake8-print
  "PYI", # flake8-pyi
  "PT", # flake8-pytest-style
  "Q", # flake8-quotes
  "TID", # flake8-tidy-imports
  "RUF", # Ruff-specific rules
]

[lint.isort]
extra-standard-library = ["typing_extensions"]
force-sort-within-sections = true

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.per-file-ignores]
# 上游 standalone 生成产物 — 导入顺序由上游管理
"src/**/*.py" = ["I001"]
# 生成器脚本豁免
"scripts/*.py" = ["ALL"]
