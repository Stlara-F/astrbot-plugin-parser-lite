line-length = 88
target-version = "py310"

[format]
line-ending = "lf"

[lint]
ignore = [
  "E402", # module-import-not-at-top-of-file
  "E501", # line-too-long
  "E701", # multiple-statements-on-one-line-colon (bridge style)
  "E702", # multiple-statements-on-one-line-semicolon (bridge style)
  "ASYNC240", # async-pathlib (bridge use of Path in async context)
  "RUF100", # unused-noqa (E501 removed from enabled rules, makes upstream noqa stale)
  "E902", # io-error (upstream bilibili files encoding, pre-existing)
  "UP037", # quoted-annotation
  "RUF001", # ambiguous-unicode-character-string
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
  "TID252", # relative-imports
  "T201", # print-found (test files + upstream utility scripts)
]
select = [
  "F", # Pyflakes
  "W", # pycodestyle warnings
  "E", # pycodestyle errors
  "I", # isort
  "UP", # pyupgrade
  "ASYNC", # flake8-async
  "C4", # flake8-comprehensions
  "T10", # flake8-debugger
  "T20", # flake8-print
  "PYI", # flake8-pyi
  "PT", # flake8-pytest-style
  "Q", # flake8-quotes
  "TID", # flake8-tidy-imports
  "RUF", # Ruff-specific rules
]

[lint.isort]
extra-standard-library = ["typing_extensions"]
force-sort-within-sections = true

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.per-file-ignores]
# Auto-generated by standalone workflow — not user-editable
"src/nonebot_plugin_parser_lite/utils/_flags.py" = ["E731", "I001"]
"src/nonebot_plugin_parser_lite/utils/env.py" = ["I001"]
"src/nonebot_plugin_parser_lite/utils/_standalone_fake.py" = ["ALL"]
