name: Sync Upstream Standalone

# 持续同步 sokoko-org/nonebot-plugin-parser-lite 的 standalone 分支到 bridge-core.
# - schedule: 每 6 小时自动检查 (仅在默认分支生效 — 本 workflow 部署于 main)
# - workflow_dispatch: 手动触发 (仓库 Actions → Sync Upstream Standalone → Run workflow)
# - 同步后 push bridge-core 自动触发其 CI (Sequential Lint and Type Check),
#   上游改动与适配层冲突时 workflow 失败 → 人工介入解决

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout bridge-core
        uses: actions/checkout@v4
        with:
          ref: bridge-core
          fetch-depth: 0

      - name: Fetch upstream standalone
        run: |
          git remote add upstream https://github.com/sokoko-org/nonebot-plugin-parser-lite.git
          git fetch upstream standalone --tags

      - name: Check for upstream updates
        id: check
        run: |
          BASE=$(git merge-base HEAD upstream/standalone)
          if [ "$BASE" = "$(git rev-parse upstream/standalone)" ]; then
            echo "bridge-core 已是最新 (standalone: $(git rev-parse --short upstream/standalone))"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "检测到上游更新: $(git log --oneline $BASE..upstream/standalone | wc -l) 个 commit"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream standalone
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge upstream/standalone --no-edit
          git push origin bridge-core
