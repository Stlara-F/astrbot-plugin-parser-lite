name: Sync Upstream

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge
          ref: brigde2astrbot

      - uses: actions/checkout@v4
        with:
          path: source
          ref: sync-upstream
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch upstream
        working-directory: source
        run: |
          git remote add upstream https://github.com/sokoko-org/nonebot-plugin-parser-lite.git 2>/dev/null || true
          git fetch upstream main

      - name: Check for new commits
        id: check
        working-directory: source
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          if [ "$BEHIND" -gt 0 ]; then
            echo "UP_TO_DATE=false" >> $GITHUB_ENV
            echo "Upstream ahead by $BEHIND commits"
          else
            echo "UP_TO_DATE=true" >> $GITHUB_ENV
          fi

      - name: Merge + prime
        if: env.UP_TO_DATE == 'false'
        working-directory: source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-edit --strategy-option=theirs || true
          rm -f src/nonebot_plugin_parser_lite/utils/_standalone_fake.py
          cat > src/nonebot_plugin_parser_lite/utils/_flags.py << 'PYEOF'
          import os
          _IS_STANDALONE = os.environ.get("PARSER_LITE_STANDALONE", "") == "1"
          PARSER_LITE_STANDALONE = _IS_STANDALONE; PARSER_LITE_PRE = "plite_"
          if _IS_STANDALONE: _STANDALONE = True; _get_flag = lambda f: os.environ.get(f"{PARSER_LITE_PRE}{f}", "")
          else: from nonebot import get_driver; _STANDALONE = False; _get_flag = lambda f: getattr(get_driver().config, f"{PARSER_LITE_PRE}{f}", "")
          PYEOF
          cat > src/nonebot_plugin_parser_lite/utils/env.py << 'PYEOF'
          import os; IS_STANDALONE = os.environ.get("PARSER_LITE_STANDALONE") == "1"
          PYEOF

      - name: Auto-patcher
        if: env.UP_TO_DATE == 'false'
        working-directory: source
        run: python ../bridge/scripts/auto_patcher.py

      - name: Verify
        if: env.UP_TO_DATE == 'false'
        working-directory: source
        run: python ../bridge/scripts/verify_import.py

      - name: Push sync-upstream
        if: env.UP_TO_DATE == 'false'
        working-directory: source
        run: |
          git add src/nonebot_plugin_parser_lite/
          git commit -m "sync: upstream/main ($(date +%Y-%m-%d))" || echo "no-op"
          git push origin HEAD:sync-upstream

      - name: Auto-merge → brigde2astrbot
        if: env.UP_TO_DATE == 'false'
        working-directory: source
        run: |
          git fetch origin brigde2astrbot
          git checkout -b merge-target origin/brigde2astrbot
          if git merge sync-upstream --no-edit 2>/dev/null; then
            git push origin merge-target:brigde2astrbot
            echo "Merged sync-upstream → brigde2astrbot"
          else
            echo "Conflict — skipping auto-merge"
          fi
