name: Generate Standalone Branch

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install & verify
        run: |
          pip install -r requirements.txt
          python -c "
          import subprocess, sys
          # Auto-install transitive deps
          patterns = {'httpx':'httpx','yarl':'yarl','qrcode':'qrcode',
              'Cryptodome':'pycryptodomex','DrissionPage':'DrissionPage','PIL':'pillow'}
          missing = []
          for imp, pkg in patterns.items():
              try: __import__(imp)
              except ImportError: missing.append(pkg)
          if missing:
              subprocess.run([sys.executable,'-m','pip','install','-q']+missing)
              print(f'Installed: {missing}')
          "

          python -c "
          import sys, os, re
          sys.path.insert(0, 'src')
          os.environ['PARSER_LITE_STANDALONE'] = '1'
          os.environ['PARSER_LITE_BASE_DIR'] = 'src/nonebot_plugin_parser_lite'

          class _F:
              def __init__(s, **kw): object.__setattr__(s, '_d', kw)
              def __getattr__(s, k):
                  try: return object.__getattribute__(s, '_d')[k]
                  except (KeyError, AttributeError): return _F()
              def __call__(s, *a, **kw):
                  if len(a)==1 and isinstance(a[0],type):
                      try: return a[0]()
                      except: pass
                  return _F()
              def __str__(s): return ''
              def __fspath__(s): return ''
              def __bool__(s): return True
              def __iter__(s): return iter([])
              def __contains__(s, _): return False
              def __or__(s, _): return s
              def __ror__(s, _): return s
              def __eq__(s, o): return isinstance(o, _F)
              def __hash__(s): return 0
              def __int__(s): return 0
              def __getitem__(s, _): return _F()
              def __mro_entries__(s, bases): return ()

          import typing
          if not hasattr(typing, 'Self'):
              from typing_extensions import Self
              typing.Self = Self

          from pathlib import Path
          D = _F(get_driver=_F(config=_F(nickname=['parser-lite'])),
                 get_plugin_config=lambda cls, *a, **kw: cls(),
                 require=lambda *a: None)
          sys.modules['nonebot'] = D
          # Auto-discover ALL nonebot* sub-modules from site-packages
          try:
              import site
              _sp = [p for p in site.getsitepackages() if os.path.isdir(p)]
              for _dir in _sp:
                  for _root, _dirs, _files in os.walk(_dir):
                      for _f in _files:
                          rp = os.path.relpath(os.path.join(_root, _f), _dir)
                          parts = rp.replace(os.sep, '.').replace('.py','').replace('.so','').split('.')
                          for i in range(len(parts)):
                              candidate = '.'.join(parts[:i+1])
                              if (candidate.startswith('nonebot_plugin_') or
                                  candidate.startswith('nonebot.') or candidate == 'nonebot'):
                                  if candidate not in sys.modules:
                                      sys.modules[candidate] = _F()
          except Exception as e:
              pass
          # Add functional overrides
          PL = Path('src/nonebot_plugin_parser_lite')
          sys.modules['nonebot_plugin_localstore'] = _F(
              get_plugin_cache_dir=lambda *a, **kw: PL/'cache',
              get_plugin_config_dir=lambda *a, **kw: PL/'config',
              get_plugin_data_dir=lambda *a, **kw: PL/'data')
          sys.modules['nonebot_plugin_apscheduler'] = _F(
              scheduler=_F(scheduled_job=lambda *a, **kw: lambda f: f))

          CHECKS = [
              'nonebot_plugin_parser_lite',
              'nonebot_plugin_parser_lite.config',
              'nonebot_plugin_parser_lite.data',
              'nonebot_plugin_parser_lite.parsers.base',
              'nonebot_plugin_parser_lite.download',
              'nonebot_plugin_parser_lite.constants',
              'nonebot_plugin_parser_lite.helper',
              'nonebot_plugin_parser_lite.render',
          ]
          for m in CHECKS:
              try:
                  __import__(m)
              except Exception as e:
                  import traceback
                  print(f'FAIL {m}: {e}')
                  print(f'')
                  print(f'=== 诊断 & 修复指南 ===')
                  _msg = str(e).lower()
                  if 'module named' in _msg:
                      _mod = str(e).split('\x27')[1] if '\x27' in str(e) else str(e)
                      if _mod.startswith('nonebot'):
                          print(f'  缺失模块: {_mod}')
                          print(f'  1. 确认 pip install nonebot2 成功')
                          print(f'  2. 将 {_mod} 加入 site-packages 扫描排除列表')
                      else:
                          print(f'  缺失第三方库: {_mod}')
                          print(f'  运行: pip install {_mod}')
                          print(f'  或将其加入 standalone.yml 的 patterns 字典')
                  elif 'unsupported operand' in _msg or '__' in _msg:
                      print(f'  _F 类缺少 dunder 方法')
                      print(f'  在 standalone.yml 的 class _F 中添加对应方法')
                  elif 'takes 0 positional' in _msg or 'takes 1 positional' in _msg:
                      print(f'  lambda/func 参数签名不匹配')
                      print(f'  找到对应的 func 定义并改为 func(*a, **kw)')
                  else:
                      print(f'  异常类型: {type(e).__name__}')
                      print(f'  查看完整 traceback 定位调用链')
                      traceback.print_exc()
                  print(f'=========================')
                  sys.exit(1)
          print(f'{len(CHECKS)}/{len(CHECKS)} imports pass')
          "

      - name: Generate standalone files
        run: |
          python -c "
          import os, re
          # ── env.py ──
          with open('src/nonebot_plugin_parser_lite/utils/env.py', 'w') as f:
              f.write('import os\nIS_STANDALONE = os.environ.get(\"PARSER_LITE_STANDALONE\") == \"1\"\n')
          # ── _flags.py ──
          with open('src/nonebot_plugin_parser_lite/utils/_flags.py', 'w') as f:
              f.write('import os\n_IS_STANDALONE = os.environ.get(\"PARSER_LITE_STANDALONE\", \"\") == \"1\"\nPARSER_LITE_STANDALONE = _IS_STANDALONE\nPARSER_LITE_PRE = \"plite_\"\nif _IS_STANDALONE: _STANDALONE = True; _get_flag = lambda f: os.environ.get(f\"{PARSER_LITE_PRE}{f}\", \"\")\nelse: from nonebot import get_driver; _STANDALONE = False; _get_flag = lambda f: getattr(get_driver().config, f\"{PARSER_LITE_PRE}{f}\", \"\")\n')
          # ── _standalone_fake.py ──
          stubs = []; seen = set()
          src = 'src/nonebot_plugin_parser_lite'
          for root, dirs, files in os.walk(src):
              for fn in files:
                  if not fn.endswith('.py'): continue
                  if fn in ('_flags.py', 'env.py', '_standalone_fake.py'): continue
                  lines = open(os.path.join(root, fn), encoding='utf-8').read().split('\n')
                  in_paren = False
                  for line in lines:
                      m = re.match(r'from\s+(nonebot(\.[a-z_]+)?)\s+import\s+(.+?)(?:\s*#.*)?$', line)
                      if m:
                          raw = m.group(3).strip()
                          if raw.endswith('('): in_paren = True; raw = raw[:-1]
                          for n in raw.split(','):
                              n = n.strip().split(' as ')[0]
                              if n and n not in seen: seen.add(n); stubs.append(n)
                      elif in_paren:
                          raw = line.split('#')[0].strip()
                          if raw.endswith(')'): in_paren = False; raw = raw[:-1]
                          if raw.endswith(','): raw = raw[:-1]
                          for n in raw.split(','):
                              n = n.strip().split(' as ')[0]
                              if n and n not in seen: seen.add(n); stubs.append(n)
          with open('src/nonebot_plugin_parser_lite/utils/_standalone_fake.py', 'w') as f:
              f.write('# Auto-generated by standalone workflow. Do not edit.\n')
              for s in sorted(stubs):
                  f.write(f'{s} = None  # type: ignore\n')
          print(f'{len(stubs)} stubs: {sorted(stubs)}')
          # ── patch __init__.py ──
          init = 'src/nonebot_plugin_parser_lite/__init__.py'
          text = open(init, encoding='utf-8').read()
          if '_STANDALONE' in text:
              print('__init__.py already patched')
          else:
              guard = '''from .utils._flags import _STANDALONE, _get_flag  # noqa: F401
          \nif _STANDALONE:
          \n    from .utils._standalone_fake import *  # noqa: F403
          \n    from logging import getLogger as _getLogger
          \n    logger = _getLogger('parser-lite')
          \n    try:
          \n        from apscheduler.schedulers.asyncio import AsyncIOScheduler
          \n        scheduler = AsyncIOScheduler()
          \n        scheduler.configure({'apscheduler.timezone': 'Asia/Shanghai'})
          \n        try: scheduler.start()
          \n        except RuntimeError: pass
          \n    except ImportError:
          \n        scheduler = None
          \n    def clear_result_cache() -> None: pass
          \nelse:
          \n'''
              indented = '\n'.join('    ' + line if line.strip() else '' for line in text.split('\n'))
              open(init, 'w', encoding='utf-8').write(guard + indented)
              print(f'Patched {init}')
          "

      - name: Push to alone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b alone
          git add -f src/nonebot_plugin_parser_lite/utils/_flags.py \
                     src/nonebot_plugin_parser_lite/utils/env.py \
                     src/nonebot_plugin_parser_lite/utils/_standalone_fake.py \
                     src/nonebot_plugin_parser_lite/__init__.py
          git commit -m "auto: generate standalone ($(date +%Y-%m-%d))" || echo "no changes"
          git push origin alone --force
          echo "Pushed standalone to alone branch"
