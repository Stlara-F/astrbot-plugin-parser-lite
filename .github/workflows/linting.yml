name: Sequential Lint and Type Check

on: [push, pull_request]

jobs:
  ruff-call:
    uses: ./.github/workflows/ruff.yml

  pytest:
    name: Pytest (bridge inline tests)
    runs-on: ubuntu-latest
    concurrency:
      group: pytest-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio
          # 从 requirements.txt 安装 (剥离 nonebot 的 standalone 版本), 含 playwright 包(不下载浏览器)
          python -m pip install $(grep -v '^#' requirements.txt | grep -v '^$')
      - name: Run pytest
        run: python -m pytest
        env:
          PARSER_LITE_STANDALONE: "1"
