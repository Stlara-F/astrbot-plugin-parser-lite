name: Generate Standalone Branch

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps + verify
        run: |
          pip install -r requirements.txt 2>&1 | tail -3
          python -c "
          import sys, re
          # ── verify_import ──
          sys.path.insert(0, 'src')
          import os; os.environ['PARSER_LITE_STANDALONE'] = '1'
          os.environ['PARSER_LITE_BASE_DIR'] = 'src/nonebot_plugin_parser_lite'

          class _F:
              def __getattr__(self,k): return _F()
              def __call__(self,*a,**kw):
                  if len(a)==1 and isinstance(a[0],type):
                      try: return a[0]()
                      except: pass
                  return _F()
              def __str__(self): return ''
              def __fspath__(self): return ''
              def __bool__(self): return True
              def __iter__(self): return iter([])
              def __contains__(self,_): return False
              def __or__(self,_): return self
              def __ror__(self,_): return self
              def __eq__(self,o): return isinstance(o,_F)
              def __hash__(self): return 0
              def __int__(self): return 0
              def __getitem__(self,_): return _F()

          import typing
          if not hasattr(typing, 'Self'):
              from typing_extensions import Self
              typing.Self = Self

          class Guard:
              def find_spec(self,fn,p,t=None):
                  if fn.startswith('nonebot_plugin_parser_lite'): return None
                  if fn=='nonebot' or fn.startswith(('nonebot.','nonebot_plugin_')):
                      if fn not in sys.modules: sys.modules[fn]=_F()
                      return None
                  return None
          sys.meta_path.insert(0,Guard())

          from pathlib import Path
          D = _F(get_driver=_F(config=_F(nickname=['parser-lite'])),
                 get_plugin_config=lambda cls,**kw: cls(),require=lambda *a:None)
          sys.modules['nonebot']=D
          PL = Path('src/nonebot_plugin_parser_lite')
          sys.modules['nonebot_plugin_localstore']=_F(
            get_plugin_cache_dir=lambda:PL/'cache',
            get_plugin_config_dir=lambda:PL/'config',
            get_plugin_data_dir=lambda:PL/'data')
          sys.modules['nonebot_plugin_apscheduler']=_F(
            scheduler=_F(scheduled_job=lambda **kw: lambda f:f))

          CHECKS=['nonebot_plugin_parser_lite',
            'nonebot_plugin_parser_lite.config',
            'nonebot_plugin_parser_lite.data',
            'nonebot_plugin_parser_lite.parsers.base',
            'nonebot_plugin_parser_lite.download',
            'nonebot_plugin_parser_lite.constants',
            'nonebot_plugin_parser_lite.helper',
            'nonebot_plugin_parser_lite.render']
          for m in CHECKS:
              try: __import__(m)
              except Exception as e:
                  print(f'FAIL {m}: {e}')
                  sys.exit(1)
          print(f'{len(CHECKS)}/{len(CHECKS)} imports pass')
          "

      - name: Generate standalone files
        run: |
          # ── env.py ──
          cat > src/nonebot_plugin_parser_lite/utils/env.py << 'PYEOF'
          import os
          IS_STANDALONE = os.environ.get("PARSER_LITE_STANDALONE") == "1"
          PYEOF

          # ── _flags.py ──
          cat > src/nonebot_plugin_parser_lite/utils/_flags.py << 'PYEOF'
          import os
          _IS_STANDALONE = os.environ.get("PARSER_LITE_STANDALONE", "") == "1"
          PARSER_LITE_STANDALONE = _IS_STANDALONE
          PARSER_LITE_PRE = "plite_"
          if _IS_STANDALONE: _STANDALONE = True; _get_flag = lambda f: os.environ.get(f"{PARSER_LITE_PRE}{f}", "")
          else: from nonebot import get_driver; _STANDALONE = False; _get_flag = lambda f: getattr(get_driver().config, f"{PARSER_LITE_PRE}{f}", "")
          PYEOF

          # ── _standalone_fake.py (auto-detect all nonebot imports) ──
          python -c "
          import re, os
          stubs = []
          seen = set()
          for root, dirs, files in os.walk('src/nonebot_plugin_parser_lite'):
              for f in files:
                  if not f.endswith('.py'): continue
                  if f in ('_flags.py', 'env.py', '_standalone_fake.py'): continue
                  text = open(os.path.join(root, f), encoding='utf-8').read()
                  for m in re.finditer(r'from (nonebot(?:\.[a-z_]+)?) import (.+)$', text, re.M):
                      names = [n.strip().split(' as ')[0] for n in m.group(2).split(',')]
                      for n in names:
                          if n and not n.startswith('(') and n not in seen:
                              seen.add(n)
                              stubs.append(n)
          with open('src/nonebot_plugin_parser_lite/utils/_standalone_fake.py', 'w') as out:
              out.write('# Auto-generated by standalone workflow. Do not edit.\n')
              for s in sorted(stubs):
                  out.write(f'{s} = None  # type: ignore\n')
          print(f'Generated {len(stubs)} stubs: {sorted(stubs)}')
          "

          # ── auto-patch __init__.py ──
          python -c "
          init = 'src/nonebot_plugin_parser_lite/__init__.py'
          text = open(init, encoding='utf-8').read()
          if '_STANDALONE' in text:
              print('__init__.py already patched')
          else:
              guard = '''from .utils._flags import _STANDALONE, _get_flag  # noqa: F401

          if _STANDALONE:
              from .utils._standalone_fake import *  # noqa: F403
              from logging import getLogger as _getLogger
              logger = _getLogger('parser-lite')
              try:
                  from apscheduler.schedulers.asyncio import AsyncIOScheduler
                  scheduler = AsyncIOScheduler()
                  scheduler.configure({'apscheduler.timezone': 'Asia/Shanghai'})
                  try: scheduler.start()
                  except RuntimeError: pass
              except ImportError:
                  scheduler = None
              def clear_result_cache() -> None: pass
          else:
          '''
              indented = '\n'.join(
                  '    ' + line if line.strip() else ''
                  for line in text.split('\n')
              )
              open(init, 'w', encoding='utf-8').write(guard + indented)
              print(f'Patched {init}')
          "

      - name: Push to alone branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b alone
          git add -f src/nonebot_plugin_parser_lite/utils/_flags.py \
                     src/nonebot_plugin_parser_lite/utils/env.py \
                     src/nonebot_plugin_parser_lite/utils/_standalone_fake.py \
                     src/nonebot_plugin_parser_lite/__init__.py
          git commit -m "auto: generate standalone ($(date +%Y-%m-%d))" || echo "no changes"
          git push origin alone --force
          echo "Pushed standalone to alone branch"
